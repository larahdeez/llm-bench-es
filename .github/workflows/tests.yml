# Pasa los tests y el linter en cada push y pull request.
# No ejecuta el benchmark: eso necesita Ollama y los modelos descargados.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: uv sync --locked --extra dev

      - name: Linter (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q
