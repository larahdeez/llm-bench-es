# Configuración del benchmark. Cada experimento debe reproducirse solo con este fichero.

experiment:
  name: baseline-cuantizacion
  seed: 42
  # Con temperatura 0 las respuestas son casi idénticas entre repeticiones.
  # Las repeticiones sirven sobre todo para medir la variación de tiempos.
  repetitions: 1
  bootstrap_samples: 1000   # remuestreos para intervalos de confianza (pendiente)

dataset:
  path: data/questions.jsonl
  schema: data/schema.json

inference:
  base_url: http://localhost:11434   # en la torre, usar la IP de la torre
  temperature: 0.0
  max_tokens: 64                     # las respuestas de opción múltiple son cortas
  context_length: 4096
  prompt_template: prompts/es_v1.txt

# Modelos evaluados. `tag` debe coincidir exactamente con el nombre de Ollama.
# `think: false` desactiva el modo de pensamiento en modelos que lo tienen.
models:
  - name: qwen2.5-7b
    tag: qwen2.5:7b
    quantization: Q4_K_M
    params_billion: 7
  - name: qwen3-8b
    tag: qwen3:8b
    think: false
    quantization: Q4_K_M
    params_billion: 8
  - name: llama3.1-8b
    tag: llama3.1:8b
    quantization: Q4_K_M
    params_billion: 8

output:
  results_csv: reports/results.csv
  figures_dir: reports/figures
